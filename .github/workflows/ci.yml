name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  qualidade-e-build:
    name: Validar Padronizacao, Tipos e Compilacao
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar o pnpm
        uses: pnpm/action-setup@v4

      - name: 3. Configurar Node.js 24 com Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 4. Instalar dependencias do monorepo
        run: pnpm install --frozen-lockfile

      - name: 5. Validar Padronizacao de Codigo (ESLint)
        run: |
          cd backend
          pnpm run lint

      - name: 6. Validar Formatacao (Prettier)
        run: |
          cd backend
          pnpm run format:check

      - name: 7. Checagem de Tipos no Backend (tsc --noEmit)
        run: |
          cd backend
          pnpm run type-check

      - name: 8. Compilar Backend para Producao
        run: |
          cd backend
          pnpm run build